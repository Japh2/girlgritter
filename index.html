

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Girlgriter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #07030c; /* Deepest cosmic purple/black */
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* The Canvas for the Stars and Heart */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* The Message Overlay */
        .message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none; /* Let mouse events pass through to the canvas */
            opacity: 0;
            transition: opacity 3s ease-in-out;
            width: 100%;
            padding: 20px;
        }

        .message-container.show {
            opacity: 1;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #c084fc; /* Light purple */
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(192, 132, 252, 0.5);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #e5e7eb;
            max-width: 600px;
            margin: 0 auto;
        }

        .highlight {
            color: #9333ea; /* Rich purple */
            font-weight: 600;
        }

        /* Instruction Text */
        .instruction {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Music Toggle Button */
        #music-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            background: rgba(147, 51, 234, 0.2);
            border: 1px solid rgba(147, 51, 234, 0.5);
            color: #c084fc;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        #music-btn:hover {
            background: rgba(147, 51, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>

    <!-- The Canvas -->
    <canvas id="canvas"></canvas>

    <!-- The Message -->
    <div class="message-container" id="message">
        <h1>Girlgriter</h1>
        <p>
            For the <span class="highlight">beautiful and humble soul</span> I've ever met.<br><br>
            I wrote this code to try and capture a fraction of your light. Move your fingers across the stars.
        </p>
    </div>

    <div class="instruction">Drag your mouse or finger to touch the stars ✨</div>

    <button id="music-btn" onclick="toggleMusic()">Play Music 🎵</button>

    <script>
        // --- AUDIO LOGIC ---
        // Replace 'song.mp3' with the name of your music file
        const audio = new Audio('song.mp3'); 
        audio.loop = true;
        let isPlaying = false;
        const musicBtn = document.getElementById('music-btn');

        function toggleMusic() {
            if (!isPlaying) {
                audio.play().catch(e => console.log("Audio file not found or blocked."));
                musicBtn.innerHTML = "Pause Music ⏸";
                // Reveal the message when the music starts
                document.getElementById('message').classList.add('show');
                isPlaying = true;
            } else {
                audio.pause();
                musicBtn.innerHTML = "Play Music 🎵";
                isPlaying = false;
            }
        }

        // --- CANVAS PARTICLE LOGIC ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, radius: 100 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles(); // Rebuild heart on resize
        }
        window.addEventListener('resize', resize);

        // Mouse / Touch tracking
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });
        // Reset mouse position when leaving screen
        window.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });
        window.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });

        // Heart Shape Math (Parametric Equation)
        function getHeartPoint(t, scale) {
            // t goes from 0 to 2*PI
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        class Particle {
            constructor(targetX, targetY, isHeart) {
                // Start at random screen position
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                // Target is either the heart shape or random background
                this.baseX = targetX;
                this.baseY = targetY;
                
                this.isHeart = isHeart;
                this.size = isHeart ? Math.random() * 2 + 1 : Math.random() * 1.5 + 0.5;
                
                // Purple color palette
                const colors = ['#9333ea', '#c084fc', '#e879f9', '#ffffff', '#a855f7'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Physics
                this.vx = 0;
                this.vy = 0;
                this.friction = 0.9;
                this.spring = 0.05;
            }

            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                // Repel from mouse
                if (distance < mouse.radius) {
                    let force = (mouse.radius - distance) / mouse.radius;
                    let directionX = dx / distance;
                    let directionY = dy / distance;
                    this.vx -= directionX * force * 5;
                    this.vy -= directionY * force * 5;
                }

                // Spring back to base position
                this.vx += (this.baseX - this.x) * this.spring;
                this.vy += (this.baseY - this.y) * this.spring;

                // Apply friction
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Add a glow effect for heart particles
                if (this.isHeart && this.size > 1.5) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }

        function initParticles() {
            particles = [];
            const centerX = width / 2;
            const centerY = height / 2;
            // Adjust scale based on screen size
            const scale = Math.min(width, height) / 45; 

            // 1. Create the Heart Particles
            const heartResolution = 400; // How many particles in the heart
            for (let i = 0; i < heartResolution; i++) {
                let t = (i / heartResolution) * Math.PI * 2;
                let point = getHeartPoint(t, scale);
                
                // Add slight randomness so it looks organic
                let targetX = centerX + point.x + (Math.random() - 0.5) * 10;
                let targetY = centerY + point.y + (Math.random() - 0.5) * 10;
                
                particles.push(new Particle(targetX, targetY, true));
            }

            // 2. Create the Background Stars
            const bgStars = (width * height) / 2000;
            for (let i = 0; i < bgStars; i++) {
                let rx = Math.random() * width;
                let ry = Math.random() * height;
                // Pass the same position as base so they don't move, but they DO repel
                particles.push(new Particle(rx, ry, false));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Clear with trail effect
            ctx.fillStyle = 'rgba(7, 3, 12, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
        }

        // Start
        resize();
        animate();
    </script>

</body>
</html>
